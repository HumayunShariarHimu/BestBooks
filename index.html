<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0d0f12; --panel:#12151a; --line:#232830;
    --txt:#e7e9ee; --mut:#8b93a1; --acc:#5eead4; --warn:#f0a35e;
  }
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--txt);line-height:1.65;
    font-family:system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(13,15,18,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 16px 12px;
  }
  .wrap{max-width:880px;margin:0 auto}
  h1{margin:0;font-size:18px;letter-spacing:.4px;font-weight:700}
  h1 span{color:var(--acc)}
  .sub{margin:2px 0 12px;font-size:12.5px;color:var(--mut)}
  .searchbox{position:relative}
  input[type=search]{
    width:100%;padding:12px 14px;border-radius:10px;
    border:1px solid var(--line);background:#0f1216;color:var(--txt);
    font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;
    -webkit-appearance:none;appearance:none;
  }
  input[type=search]::placeholder{color:#5c6472}
  input[type=search]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(94,234,212,.08)}
  .filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .f{
    padding:6px 13px;font-size:12.5px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);background:#0f1216;color:var(--mut);
    font-family:inherit;transition:.15s;
  }
  .f:hover{color:var(--txt);border-color:#39404b}
  .f.on{border-color:var(--acc);color:var(--acc);background:rgba(94,234,212,.08)}
  .count{font-size:12px;color:var(--mut);margin-top:9px}
  main{max-width:880px;margin:0 auto;padding:6px 16px 70px}
  .card{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .card:hover .t{color:var(--acc)}
  .num{
    min-width:36px;font-size:12px;color:#5c6472;padding-top:4px;
    font-variant-numeric:tabular-nums;text-align:right;
  }
  .info{flex:1;min-width:0}
  .t{font-size:15px;font-weight:600;transition:color .15s;word-wrap:break-word}
  .a{font-size:12.5px;color:var(--mut);margin-top:1px}
  .links{display:flex;gap:6px;flex-shrink:0;padding-top:3px}
  .links a{
    font-size:11.5px;text-decoration:none;padding:5px 10px;border-radius:7px;
    border:1px solid var(--line);color:var(--mut);white-space:nowrap;transition:.15s;
  }
  .links a:hover{border-color:var(--acc);color:var(--acc);background:rgba(94,234,212,.06)}
  .links a.pdf:hover{border-color:var(--warn);color:var(--warn);background:rgba(240,163,94,.06)}
  mark{background:rgba(94,234,212,.2);color:var(--acc);border-radius:3px;padding:0 1px}
  .empty{text-align:center;color:var(--mut);padding:56px 0;font-size:14px}
  footer{
    text-align:center;font-size:11.5px;color:#525a67;
    padding:22px 16px 40px;border-top:1px solid var(--line);margin-top:10px;
  }
  @media (max-width:540px){
    .card{flex-wrap:wrap}
    .links{width:100%;padding-left:48px}
    .num{min-width:32px}
  }
</style>

["শ্রীকান্ত (অখণ্ড)","শরৎচন্দ্র চট্টোপাধ্যায়"],
["সেভেন ইয়ার্স ইন টিবেট","হেইনরিখ হারের"],
["থাংলিয়ানা","থমাস হারবার্ট লুইন"],
["উভচর মানুষ","আলেক্সান্দর বেলায়েভ"],
["বাঙালী ও বাঙলা সাহিত্য (প্রথম খণ্ড)","আহমদ শরীফ"],
["পরশুরাম গল্পসমগ্র","রাজশেখর বসু"],
["১৯৮৪","জর্জ অরওয়েল"],
["যৌথ একাকীত্ব","মঞ্জু সরকার"],
["জীবন-তৃষা","আরভিং স্টোন"],
["মনঃসমীক্ষা","সিগমুন্ড ফ্রয়েড"],
["ছবি বানানোর গল্প","হুমায়ূন আহমেদ"],
["The Secret: Daily Techniques","Rhonda Byrne"],
["সক্রেটিসের জবানবন্দি ও মৃত্যুদণ্ড","প্লেটো"],
["অ্যানিমেল ফার্ম","জর্জ অরওয়েল"],
["সালতানাত-ই-বাঙ্গালাহ","নিসর্গ মেরাজ চৌধুরী"],
["মোগলনামা (প্রথম খণ্ড)","মাহমুদুর রহমান"],
["পিতা পুত্র","ইভান তুর্গেনেভ"],
["নন্দনতত্ত্ব","সৈয়দ মনজুরুল ইসলাম"]
];

/* ============================================================
   অ্যাপ লজিক
   ============================================================ */
const listEl  = document.getElementById("list");
const qEl     = document.getElementById("q");
const countEl = document.getElementById("count");
const subEl   = document.getElementById("sub");

const BN_DIGITS = "০১২৩৪৫৬৭৮৯";
const toBn = n => String(n).replace(/\d/g, d => BN_DIGITS[+d]);
const isBangla = s => /[\u0980-\u09FF]/.test(s);

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* মিলে যাওয়া অংশ হাইলাইট */
function hl(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) +
         "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" +
         esc(text.slice(i + q.length));
}

/* Google সার্চ লিংক — বইয়ের নাম কোটেশনে, সাথে লেখক */
function googleURL(title, author) {
  const extra = isBangla(title) ? "বই" : "book";
  return "https://www.google.com/search?q=" +
         encodeURIComponent(`"${title}" ${author} ${extra}`.replace(/\s+/g, " ").trim());
}

/* PDF খোঁজার লিংক */
function pdfURL(title, author) {
  return "https://www.google.com/search?q=" +
         encodeURIComponent(`"${title}" ${author} pdf`.replace(/\s+/g, " ").trim());
}

let activeLang = "all";
let timer = null;

function render() {
  const q = qEl.value.trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let shown = 0;

  for (let i = 0; i < BOOKS.length; i++) {
    const title  = BOOKS[i][0];
    const author = BOOKS[i][1] || "";
    const bangla = isBangla(title);

    if (activeLang === "bn" && !bangla) continue;
    if (activeLang === "en" &&  bangla) continue;
    if (q && !(title + " " + author).toLowerCase().includes(q)) continue;

    shown++;

    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML =
      '<div class="num">' + toBn(i + 1) + '</div>' +
      '<div class="info">' +
        '<div class="t">' + hl(title, q) + '</div>' +
        (author ? '<div class="a">' + hl(author, q) + '</div>' : '') +
      '</div>' +
      '<div class="links">' +
        '<a href="' + googleURL(title, author) + '" target="_blank" rel="noopener">Google</a>' +
        '<a class="pdf" href="' + pdfURL(title, author) + '" target="_blank" rel="noopener">PDF</a>' +
      '</div>';

    frag.appendChild(card);
  }

  listEl.textContent = "";
  if (shown === 0) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "কোনো বই পাওয়া যায়নি — অন্য নাম দিয়ে চেষ্টা করুন।";
    listEl.appendChild(d);
  } else {
    listEl.appendChild(frag);
  }

  countEl.textContent = q || activeLang !== "all"
    ? toBn(BOOKS.length) + "টি বইয়ের মধ্যে " + toBn(shown) + "টি দেখানো হচ্ছে"
    : "মোট " + toBn(BOOKS.length) + "টি বই";
}

/* ইনপুট (debounce) */
qEl.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(render, 90);
});

/* ভাষা ফিল্টার */
document.querySelectorAll(".f").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".f").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    activeLang = btn.dataset.lang;
    render();
  });
});

/* কীবোর্ড শর্টকাট: "/" = ফোকাস, Esc = ক্লিয়ার */
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qEl) {
    e.preventDefault();
    qEl.focus();
  } else if (e.key === "Escape") {
    qEl.value = "";
    qEl.blur();
    render();
  }
});

/* শুরু */
subEl.textContent = "বই খুঁজুন — Google ও PDF লিংকসহ · " + toBn(BOOKS.length) + "টি বই";
render();
</script>
